services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5177:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
